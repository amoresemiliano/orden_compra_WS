<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos El Criollo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img src="logo.png" alt="El Criollo" class="logo">
    </header>

    <nav class="tab-nav">
        <button class="tab-btn active" onclick="ui.openTab('pedidos')">Pedidos</button>
        <button class="tab-btn" onclick="ui.openTab('historial')">Historial</button>
    </nav>

    <main class="container">
        <section id="pedidos" class="tab-content active">
            <div class="config-section">
                <label>Proveedor</label>
                <select id="provider-select" onchange="ui.handleProviderChange()">
                    <option value="new">-- Nuevo Proveedor --</option>
                </select>
                <div id="new-provider-fields">
                    <input type="text" id="provider-name" placeholder="Nombre (Ej: Frutas Pepe)">
                    <input type="tel" id="provider-phone" placeholder="WhatsApp (Ej: 34600000000)">
                </div>
                <label>Mensaje Personalizado</label>
                <textarea id="custom-message">Buenos días, le envio la orden de compra de El Criollo, muchas gracias!</textarea>
            </div>

            <div class="order-form">
                <div class="form-row">
                    <select id="product-select"></select>
                    <input type="number" id="quantity" placeholder="Cant." min="0.1" step="0.1">
                </div>
                <button onclick="orderManager.addItem()" class="btn-secondary">Añadir a la Lista</button>
            </div>

            <div class="summary">
                <ul id="order-list"></ul>
                <button id="send-whatsapp" onclick="orderManager.sendOrder()" class="btn-whatsapp">
                    Enviar Orden por WhatsApp
                </button>
            </div>
        </section>

        <section id="historial" class="tab-content">
            <div class="table-responsive">
                <table class="excel-table">
                    <thead>
                        <tr>
                            <th>Ref.</th>
                            <th>Fecha</th>
                            <th>Proveedor</th>
                            <th>Productos</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modal-detalle" class="modal">
        <div class="modal-content">
            <span class="close" onclick="ui.closeModal()">&times;</span>
            <h3 id="modal-title"></h3>
            <div id="modal-items"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
